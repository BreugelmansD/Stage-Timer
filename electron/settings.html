<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'" />
  <title>Instellingen</title>
  <link rel="stylesheet" href="../public/brand/fonts.css" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 22px; background: #01171c; color: #e9fdff; font: 500 14px/1.45 Montserrat, system-ui, sans-serif; }
    h1 { font-size: 1.05rem; margin: 0 0 4px; }
    p { color: #86aeb7; margin: 0 0 16px; font-size: .85rem; }
    label { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; font-weight: 600; }
    input { font: inherit; color: inherit; background: #011318; border: 1px solid #0c4654; border-radius: 12px; padding: 9px 12px; }
    input:focus { outline: 2px solid #19a3ad; outline-offset: -1px; }
    .hint { font-weight: 500; color: #86aeb7; font-size: .8rem; }
    .row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
    button { font: inherit; font-weight: 700; border-radius: 999px; padding: 8px 18px; cursor: pointer; border: 1px solid #0c4654; background: #06323c; color: #e9fdff; }
    button.primary { background: #e9fdff; border-color: #e9fdff; color: #004255; }
    .error { color: #ff8a80; min-height: 1.2em; font-size: .85rem; }
  </style>
</head>
<body>
  <h1>Instellingen</h1>
  <p id="current">Laden…</p>
  <form id="form">
    <label>Poort
      <input id="port" type="number" min="1024" max="65535" required />
      <span class="hint">Standaard 3000. Andere toestellen openen http://&lt;adres-van-deze-Mac&gt;:poort</span>
    </label>
    <label>Pincode voor de bediening
      <input id="pin" type="text" maxlength="32" autocomplete="off" placeholder="Leeg = geen pincode" />
      <span class="hint">Het scherm (de klok) blijft zonder pincode te bekijken.</span>
    </label>
    <div class="error" id="error"></div>
    <div class="row">
      <button type="button" id="cancel">Annuleren</button>
      <button type="submit" class="primary">Bewaren</button>
    </div>
  </form>
  <script>
    (async () => {
      const s = await window.stageApp.getSettings();
      document.getElementById('port').value = s.port;
      document.getElementById('pin').value = s.pin || '';
      const ip = s.addresses[0];
      document.getElementById('current').textContent =
        `Stage Timer draait nu op poort ${s.activePort}` + (ip ? ` (http://${ip}:${s.activePort}/)` : '') + '.';
    })();
    document.getElementById('cancel').onclick = () => window.close();
    document.getElementById('form').onsubmit = async (e) => {
      e.preventDefault();
      const res = await window.stageApp.saveSettings({
        port: document.getElementById('port').value,
        pin: document.getElementById('pin').value,
      });
      document.getElementById('error').textContent = res.ok ? '' : res.error;
      if (res.ok) window.close();
    };
  </script>
</body>
</html>
