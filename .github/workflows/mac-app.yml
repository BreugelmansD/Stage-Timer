name: Mac-app bouwen

# Start handmatig (tabblad Actions → "Mac-app bouwen" → Run workflow)
# of automatisch bij een versietag, bv. v1.1.0 (dan komt de .dmg ook bij Releases).
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Afhankelijkheden installeren
        run: npm ci

      - name: Tests
        run: npm test

      - name: App bouwen en ad-hoc ondertekenen (Apple Silicon + Intel)
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Ondertekening controleren
        run: codesign --verify --deep --strict --verbose=2 "dist/mac-universal/Stage Timer.app"

      - name: DMG maken
        run: |
          mkdir -p dmg
          cp -R "dist/mac-universal/Stage Timer.app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Stage Timer" -srcfolder dmg -ov -format UDZO Stage-Timer-mac.dmg
          ls -lh Stage-Timer-mac.dmg

      - name: DMG bewaren als artefact
        uses: actions/upload-artifact@v4
        with:
          name: Stage-Timer-mac
          path: Stage-Timer-mac.dmg
          retention-days: 30

      - name: Release maken (alleen bij een versietag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Stage-Timer-mac.dmg
